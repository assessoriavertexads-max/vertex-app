<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- App Title and Description -->
    <title>Vertos - Gestão de Performance</title>
    <meta name="description" content="Plataforma integrada de gestão de performance para agências">
    <meta name="author" content="Vertos" />

    <!-- PWA Meta Tags -->
    <meta name="theme-color" content="#0f172a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Vertos" />

    <!-- Preload Inter font to avoid critical request chain -->
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preload" href="https://fonts.gstatic.com/s/inter/v20/UcC73FwrK3iLTeHuS_nVMrMxCp50SjIa1ZL7W0Q5nw.woff2" as="font" type="font/woff2" crossorigin />

    <!-- Icons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/icons/icon-192x192.png" />

    <!-- Manifest -->
    <link rel="manifest" href="/manifest.json" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Vertos - Gestão de Performance">
    <meta property="og:description" content="Plataforma integrada de gestão de performance para agências">

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Vertos - Gestão de Performance">
    <meta name="twitter:description" content="Plataforma integrada de gestão de performance para agências">
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/service-worker.js').then((registration) => {
            console.log('Service Worker registrado:', registration);
          }).catch((error) => {
            console.error('Erro ao registrar Service Worker:', error);
          });
        });
      }
    </script>
  </body>
</html>
