<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- App Title and Description -->
    <title>Vertex - Business Intelligence & Financial Management</title>
    <meta name="description" content="Plataforma integrada de inteligência empresarial e gestão financeira">
    <meta name="author" content="Vertex Team" />

    <!-- PWA Meta Tags -->
    <meta name="theme-color" content="#0f172a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Vertex" />

    <!-- Icons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/icons/icon-192x192.png" />

    <!-- Manifest -->
    <link rel="manifest" href="/manifest.json" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Vertex - Business Intelligence & Financial Management">
    <meta property="og:description" content="Plataforma integrada de inteligência empresarial e gestão financeira">

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@Vertex" />
    <meta name="twitter:title" content="Vertex - Business Intelligence & Financial Management">
    <meta name="twitter:description" content="Plataforma integrada de inteligência empresarial e gestão financeira">
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/service-worker.js').then((registration) => {
            console.log('Service Worker registrado:', registration);
          }).catch((error) => {
            console.error('Erro ao registrar Service Worker:', error);
          });
        });
      }
    </script>
  </body>
</html>
